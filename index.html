<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3e6c9;
    --paper-dark: #e8d7b0;
    --ink: #2b2b2b;
    --blue: #2c5a96;
    --tape: rgba(214, 196, 150, .8);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(190,150,90,.15), transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: "Cutive Mono", "Courier New", monospace;
    padding: 0 16px 64px;
    overflow-x: hidden;
  }
  main { max-width: 1180px; margin: 0 auto; position: relative; }

  h1 {
    font-family: "Special Elite", "Courier New", monospace;
    font-weight: 400;
    font-size: clamp(56px, 9vw, 120px);
    letter-spacing: .08em;
    margin: 0;
    padding: 56px 0 36px 24px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 36px;
    padding: 12px;
  }

  /* hand-drawn blue double frame */
  .card {
    position: relative;
    display: block;
    padding: 36px 28px 30px;
    color: inherit;
    text-decoration: none;
    border: 3px solid var(--blue);
    border-radius: 3px;
    outline: 2px solid var(--blue);
    outline-offset: -11px;
    transition: transform .2s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-6px) rotate(-.6deg); }
  .card:focus-visible { box-shadow: 0 0 0 4px rgba(44,90,150,.35); }
  .card::before, .card::after { /* corner flourishes */
    content: "✦"; position: absolute; color: var(--blue); font-size: 22px; line-height: 1;
  }
  .card::before { top: 4px; left: 6px; }
  .card::after { bottom: 4px; right: 6px; }

  .photo {
    position: relative;
    background: #fff;
    padding: 8px 8px 8px;
    box-shadow: 0 3px 10px rgba(0,0,0,.28);
    transform: rotate(var(--tilt, -.5deg));
    margin-bottom: 22px;
  }
  .photo img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
  .photo::before { /* tape */
    content: ""; position: absolute; top: -18px; left: 50%;
    width: 38%; height: 30px; margin-left: -12%;
    background: var(--tape);
    transform: rotate(-2deg);
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }

  .title {
    font-family: "Special Elite", "Courier New", monospace;
    font-size: clamp(30px, 3.4vw, 42px);
    letter-spacing: .06em;
    margin: 0;
    line-height: 1.1;
  }
  .meta { margin: 12px 0 0; font-size: 20px; letter-spacing: .06em; }
  .play {
    display: inline-block; margin-top: 14px;
    font-family: "Special Elite", monospace; font-size: 18px; letter-spacing: .08em;
    color: var(--blue); border-bottom: 2px solid var(--blue);
  }

  .sparkle { position: absolute; color: var(--blue); pointer-events: none; opacity: .85; }
  footer { text-align: center; margin-top: 48px; font-size: 18px; opacity: .65; }

  @media (max-width: 640px) {
    h1 { padding: 40px 0 24px 8px; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main>
  <span class="sparkle" style="top:90px; left:46%; font-size:26px">✦</span>
  <span class="sparkle" style="top:150px; right:28%; font-size:34px">✧</span>
  <span class="sparkle" style="top:60px; right:8%; font-size:40px">✦</span>

  <h1>Games</h1>

  <div class="grid">
    <a class="card" href="monster-truck-stack/">
      <div class="photo" style="--tilt:-.6deg">
        <img src="thumbs/monster-truck-stack.png" alt="Truck Stack title screen with a smiling sun" loading="lazy">
      </div>
      <h2 class="title">truck stack</h2>
      <p class="meta">Monster truck game, 2026</p>
      <span class="play">play ▸</span>
    </a>

    <a class="card" href="letter-stickers/">
      <div class="photo" style="--tilt:.5deg">
        <img src="thumbs/letter-stickers.png" alt="Letter Stickers chalkboard title screen" loading="lazy">
      </div>
      <h2 class="title">letter stickers</h2>
      <p class="meta">Learning game, 2026</p>
      <span class="play">play ▸</span>
    </a>

    <!-- To add a game: copy a card above, add a folder with its index.html, and a thumbnail in thumbs/ -->
  </div>

  <footer>more games coming soon ✦</footer>
</main>
</body>
</html>
