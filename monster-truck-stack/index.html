<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Truck Stack</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4vh;
    font-family: "Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", sans-serif;
    color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.25); pointer-events: none;
  }
  #start h1 { font-size: min(11vw, 120px); margin: 0; letter-spacing: 2px;
    -webkit-text-stroke: 3px #1d3c78; }
  .keys { display: flex; gap: 6vw; }
  .key { display: flex; flex-direction: column; align-items: center; gap: 12px;
    font-size: min(5vw, 44px); }
  .cap { background: #fff; color: #1d3c78; border-radius: 18px; padding: 18px 36px;
    box-shadow: 0 8px 0 #1d3c78; text-shadow: none; font-size: min(5vw, 44px);
    animation: press 1.2s ease-in-out infinite; }
  .cap.space { padding: 18px 90px; }
  .cap.shift { animation-delay: .4s; background: #b8f2c6; }
  .cap.enter { animation-delay: .8s; background: #ffd23f; }
  @keyframes press { 0%,100% { transform: translateY(0); box-shadow: 0 8px 0 #1d3c78; }
                     50% { transform: translateY(6px); box-shadow: 0 2px 0 #1d3c78; } }
  #start.hidden { opacity: 0; transition: opacity .4s; }
  #wake {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(29,60,120,.55); cursor: pointer;
    font-family: "Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", sans-serif;
  }
  #wake.show { display: flex; }
  #wake div { background: #fff; color: #1d3c78; border-radius: 28px; padding: 28px 48px;
    font-size: min(7vw, 64px); box-shadow: 0 10px 0 #1d3c78; animation: press 1.2s ease-in-out infinite; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start">
  <h1>Truck Stack!</h1>
  <div class="keys">
    <div class="key"><div class="cap space">SPACE</div>jump!</div>
    <div class="key"><div class="cap shift">SHIFT</div>sound!</div>
    <div class="key"><div class="cap enter">ENTER</div>crash!</div>
  </div>
</div>
<div id="wake"><div>👆 Click to play!</div></div>
<script>
// ---------- trucks ----------
const LIST = [["00","JCB Digger"],["01","Fire Truck"],["02","Police Car"],["03","Zombie"],["04","Shark"],["05","Skeleton"],["06","Triceratops"],["07","Witch"],["08","Ice"],["09","Tiger"],["10","Dragon"],["11","Unicorn"],["12","Commando"],["13","Ambulance"],["14","Earth Shaker"],["15","Hot Wheels"],["16","Maximum Destruction"],["17","El Toro Loco"],["18","Grave Digger"],["19","Bigfoot"],["20","Tank"],["21","School Bus"],["22","Fire Truck"],["23","Cement Mixer"],["24","Garbage Truck"],["25","Tow Truck"],["26","Ice Cream Truck"],["27","Monster Van"],["28","Dump Truck"],["29","Tractor"],["30","Bulldozer"],["31","Logging Truck"],["32","Dino Truck"],["33","Shark"],["34","Pirate Ship"],["35","Space Truck"],["36","Rescue Helicopter"],["37","Snow Plow"],["38","Harvester"],["39","Crane"],["40","Airplane"],["41","Rocket"],["42","Submarine"],["43","Music Truck"],["44","Grave Digger"],["45","Grave Digger"],["46","Megalodon"],["47","El Toro Loco"],["48","School Bus"],["49","Bigfoot"],["50","Monster Energy"],["51","Monster Mutt"],["52","Dragon"],["53","Son-uva Digger"],["54","USA-1"],["55","Raminator"],["56","Tiger Shark"],["57","Blaze"],["58","Rhino"],["59","Zombie"]];
const TRUCKS = LIST.map(([id, name]) => {
  const img = new Image();
  img.src = `trucks/truck${id}.png`;
  return { img, name };
});

let deck = [];
function nextTruck() {
  if (!deck.length) {
    deck = TRUCKS.map((_, i) => i);
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
  }
  return TRUCKS[deck.pop()];
}

// ---------- canvas / camera ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener('resize', resize); resize();

const TRUCK_W = 300;          // world units
const STACK_OVERLAP = 0.86;   // wheels sink a little into the roof below
const MAX_STACK = 25;
let scale = 1, groundY = 0;
function baseScale() { return Math.min(H / 850, W / 1000); }
function toScreen(x, y) { return [W / 2 + x * scale, groundY - y * scale]; }

// ---------- state ----------
const stack = [];   // landed trucks: {truck, x, y, w, h, flip, squash, born}
const flying = [];  // in the air
const debris = [];  // crash pieces
const particles = [];
const clouds = Array.from({ length: 6 }, () => ({
  x: Math.random(), y: 0.08 + Math.random() * 0.35, s: 0.6 + Math.random() * 0.8,
  v: 0.004 + Math.random() * 0.006
}));
let reservedTop = 0;   // where the next truck will land (includes in-flight)
let fromLeft = true;
let sway = 0, swayT = 0;
let bubble = null;     // big count + name
let crashingUntil = 0;
let started = false;

function stackTopOf(list) {
  if (!list.length) return 0;
  const t = list[list.length - 1];
  return t.y + t.h * STACK_OVERLAP;
}

function launch() {
  const now = performance.now();
  if (now < crashingUntil) return;
  if (stack.length + flying.length >= MAX_STACK) { crash(); return; }
  const truck = nextTruck();
  const aspect = truck.img.naturalWidth ? truck.img.naturalWidth / truck.img.naturalHeight : 1.2;
  const w = TRUCK_W, h = w / aspect;
  const targetY = reservedTop;
  reservedTop += h * STACK_OVERLAP;
  const targetX = (Math.random() - 0.5) * 40;
  const side = fromLeft ? -1 : 1;
  fromLeft = !fromLeft;
  const startX = side * (W / 2 / scale + w);
  const count = stack.length + flying.length + 1;
  flying.push({
    truck, w, h, x: startX, y: 0, startX, targetX, targetY,
    flip: side > 0, t0: now, dur: 1100 + Math.min(targetY, 2000) * 0.15,
    spin: count % 4 === 0 ? -side : 0, rot: 0, count
  });
  sfx.vroom();
}

function land(f) {
  const now = performance.now();
  stack.push({ truck: f.truck, x: f.targetX, y: f.targetY, w: f.w, h: f.h,
               flip: f.flip, squash: 1, born: now });
  sway = 14; swayT = now;
  sfx.boing();
  burst(f.targetX, f.targetY + 20, 18, ['#ffd23f', '#ff5e5b', '#3ec1d3', '#7bd389', '#fff']);
  const n = stack.length;
  bubble = { n, name: f.truck.name, t: now };
  if (n % 5 === 0) {
    sfx.cheer();
    say(`${f.truck.name}! ${n}! Hooray!`);
    for (let i = 0; i < 4; i++) burst((Math.random() - .5) * 600, f.targetY + 100, 25, ['#ffd23f', '#ff5e5b', '#3ec1d3', '#b388ff']);
  } else {
    say(`${f.truck.name}!`);
  }
}

function crash() {
  const now = performance.now();
  if (now < crashingUntil) return;
  if (!stack.length && !flying.length) { sfx.honk(); return; }
  for (const t of [...stack, ...flying.map(f => ({ ...f, y: f.y, x: f.x }))]) {
    debris.push({
      truck: t.truck, w: t.w, h: t.h, flip: t.flip,
      x: t.x, y: t.y, vx: (Math.random() - 0.5) * 900 + (t.x > 0 ? 200 : -200),
      vy: 300 + Math.random() * 600, rot: t.rot || 0, vr: (Math.random() - 0.5) * 10,
      bounces: 0, born: now
    });
    burst(t.x, t.y + t.h / 2, 10, ['#ff9f1c', '#ffbf69', '#8d6e63', '#fff']);
  }
  stack.length = 0; flying.length = 0; reservedTop = 0; bubble = null;
  crashingUntil = now + 1500;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  crashSound.currentTime = 0;
  crashSound.play().catch(() => sfx.crash());
}

function burst(x, y, n, colors) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 200 + Math.random() * 500;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 300,
      c: colors[i % colors.length], r: 6 + Math.random() * 10, life: 1,
      star: Math.random() < 0.5 });
  }
}

// ---------- recorded crash sound ----------
const crashSound = new Audio('sounds/crash.m4a');
crashSound.preload = 'auto';

// ---------- speech ----------
function say(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95; u.pitch = 1.3; u.volume = 1;
  speechSynthesis.speak(u);
}

// ---------- sound effects (no files needed) ----------
const sfx = (() => {
  let ac = null;
  const A = () => (ac ||= new (window.AudioContext || window.webkitAudioContext)());
  function tone(type, f0, f1, dur, vol = 0.3, delay = 0) {
    const a = A(), t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, cutoff) {
    const a = A(), t = a.currentTime;
    const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start(t);
  }
  return {
    ctx: A,
    unlock() { A().resume(); },
    vroom() { tone('sawtooth', 70, 190, 0.6, 0.12); tone('square', 50, 120, 0.6, 0.05); },
    boing() { tone('sine', 520, 140, 0.35, 0.35); tone('triangle', 260, 90, 0.25, 0.2); },
    honk() { tone('square', 440, 430, 0.25, 0.12); tone('square', 554, 545, 0.25, 0.1, 0.3); },
    cheer() { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.25, 0.25, i * 0.11)); },
    crash() {
      noise(1.4, 0.9, 1200); noise(0.5, 0.6, 4000);
      for (let i = 0; i < 6; i++) tone('square', 200 + Math.random() * 600, 80, 0.15, 0.08, i * 0.09);
    }
  };
})();

// ---------- vehicle sounds (Shift) ----------
const vehicleSound = (() => {
  let bus = null;   // the sound that's playing now, so a new one can replace it

  // f: [[seconds, freq], ...] — the pitch follows these points
  function voice(out, type, f, dur, vol, { delay = 0, step = false, lp = 0, trem = 0, tremDepth = 0.6 } = {}) {
    const a = sfx.ctx(), t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f[0][1], t);
    for (const [s, hz] of f.slice(1)) {
      if (step) o.frequency.setValueAtTime(hz, t + s);
      else o.frequency.linearRampToValueAtTime(hz, t + s);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.03);
    g.gain.setValueAtTime(vol, t + Math.max(0.04, dur - 0.08));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (lp) { const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; node.connect(fl); node = fl; }
    if (trem) {
      const tg = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
      lfo.frequency.value = trem; lg.gain.value = tremDepth; tg.gain.value = 1 - tremDepth;
      lfo.connect(lg).connect(tg.gain); lfo.start(t); lfo.stop(t + dur + 0.05);
      node.connect(tg); node = tg;
    }
    node.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.05);
  }

  // filtered noise: cut = [[seconds, cutoff], ...]
  function hiss(out, dur, vol, cut, { delay = 0, type = 'lowpass', q = 1, trem = 0, decay = false } = {}) {
    const a = sfx.ctx(), t = a.currentTime + delay;
    const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      let v = Math.random() * 2 - 1;
      if (decay) v *= (1 - i / d.length) ** 2;
      if (trem) v *= Math.sin(i / a.sampleRate * trem * Math.PI) ** 2;
      d[i] = v;
    }
    const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(cut[0][1], t);
    for (const [sec, hz] of cut.slice(1)) fl.frequency.linearRampToValueAtTime(hz, t + sec);
    g.gain.value = vol;
    s.connect(fl).connect(g).connect(out); s.start(t);
  }

  const note = n => 440 * 2 ** ((n - 69) / 12);   // MIDI number -> Hz

  const SOUNDS = {
    ambulance(o) {   // nee-naw
      const f = []; for (let i = 0; i < 8; i++) f.push([i * 0.4, i % 2 ? 770 : 960]);
      voice(o, 'square', f, 3.2, 0.12, { step: true, lp: 2500 });
      voice(o, 'triangle', f, 3.2, 0.2, { step: true });
    },
    fire(o) {        // rising-falling wail
      voice(o, 'sawtooth', [[0, 500], [1, 1300], [1.6, 1300], [2.6, 500], [3.2, 1300]], 3.4, 0.12, { lp: 3000 });
      voice(o, 'sine', [[0, 500], [1, 1300], [1.6, 1300], [2.6, 500], [3.2, 1300]], 3.4, 0.2);
    },
    police(o) {      // fast whoop-whoop
      const f = []; for (let i = 0; i < 10; i++) { f.push([i * 0.28, 700]); f.push([i * 0.28 + 0.24, 1500]); }
      voice(o, 'square', f, 2.8, 0.1, { lp: 2800 });
      voice(o, 'sine', f, 2.8, 0.2);
    },
    helicopter(o) {  // chop-chop-chop
      hiss(o, 2.5, 1.2, [[0, 500]], { trem: 13 });
      voice(o, 'sawtooth', [[0, 55], [2.5, 60]], 2.5, 0.15, { lp: 300, trem: 13, tremDepth: 0.9 });
    },
    airplane(o) {    // jet zooms past
      hiss(o, 2.5, 0.9, [[0, 300], [1.3, 2500], [2.5, 400]], { type: 'bandpass', q: 0.7 });
      voice(o, 'sine', [[0, 700], [1.3, 1400], [2.5, 600]], 2.5, 0.08);
    },
    rocket(o) {      // 3-2-1 blast off!
      [0, 0.45, 0.9].forEach(d => voice(o, 'square', [[0, 880]], 0.15, 0.1, { delay: d }));
      voice(o, 'square', [[0, 1320]], 0.3, 0.1, { delay: 1.35 });
      hiss(o, 2, 1.2, [[0, 200], [2, 4000]], { delay: 1.4 });
      voice(o, 'sine', [[0, 200], [2, 1600]], 2, 0.15, { delay: 1.4 });
    },
    tank(o) {        // BOOM ... BOOM
      [0, 0.9].forEach(d => {
        hiss(o, 1, 1.5, [[0, 900], [0.6, 100]], { delay: d, decay: true });
        voice(o, 'sine', [[0, 90], [0.6, 30]], 0.7, 0.6, { delay: d });
      });
    },
    bus(o) {         // beep beep!
      [0, 0.45].forEach(d => [330, 415].forEach(hz => voice(o, 'square', [[0, hz]], 0.35, 0.1, { delay: d, lp: 1800 })));
    },
    iceCream(o) {    // Twinkle Twinkle on a music box
      [72, 72, 79, 79, 81, 81, 79, 77, 77, 76, 76, 74, 74, 72].forEach((n, i) => {
        const d = i * 0.26 + (i >= 7 ? 0.26 : 0);
        voice(o, 'sine', [[0, note(n)]], 0.3, 0.25, { delay: d });
        voice(o, 'sine', [[0, note(n + 12)]], 0.2, 0.06, { delay: d });
      });
    },
    music(o) {       // boom-tss party beat
      for (let i = 0; i < 8; i++) {
        const d = i * 0.25;
        if (i % 2 === 0) voice(o, 'sine', [[0, 150], [0.15, 45]], 0.2, 0.6, { delay: d });
        else hiss(o, 0.1, 0.5, [[0, 8000]], { delay: d, type: 'highpass', decay: true });
        voice(o, 'sawtooth', [[0, note([36, 36, 43, 43, 41, 41, 43, 48][i])]], 0.22, 0.12, { delay: d, lp: 900 });
      }
    },
    submarine(o) {   // sonar ping ... ping
      [0, 1.1].forEach(d => [0, 0.25, 0.5].forEach((e, k) =>
        voice(o, 'sine', [[0, 1100]], 0.6, 0.3 / (k + 1), { delay: d + e })));
    },
    ship(o) {        // foghorn
      [0, 1.4].forEach(d => {
        voice(o, 'sawtooth', [[0, 98], [1.1, 96]], 1.1, 0.25, { delay: d, lp: 500 });
        voice(o, 'sawtooth', [[0, 147], [1.1, 145]], 1.1, 0.12, { delay: d, lp: 500 });
      });
    },
    roar(o) {        // RAAWRR
      voice(o, 'sawtooth', [[0, 110], [0.3, 180], [1.4, 70]], 1.5, 0.35, { lp: 900, trem: 28, tremDepth: 0.5 });
      voice(o, 'square', [[0, 55], [0.3, 90], [1.4, 35]], 1.5, 0.15, { lp: 400 });
      hiss(o, 1.5, 0.6, [[0, 600], [0.3, 1500], [1.5, 300]], { type: 'bandpass', q: 1.5 });
    },
    shark(o) {       // da-dum ... da-dum ... CHOMP
      [0, 0.6, 1.05, 1.4, 1.65, 1.85, 2.0, 2.12].forEach((d, i) =>
        voice(o, 'sawtooth', [[0, i % 2 ? 87 : 82]], 0.18, 0.3, { delay: d, lp: 500 }));
      hiss(o, 0.25, 1.5, [[0, 2000]], { delay: 2.35, decay: true });
      voice(o, 'square', [[0, 300], [0.2, 80]], 0.25, 0.2, { delay: 2.35, lp: 1200 });
    },
    spooky(o) {      // wooOOooo
      voice(o, 'sine', [[0, 260], [0.8, 520], [1.6, 330], [2.4, 600], [3, 220]], 3, 0.3, { trem: 6, tremDepth: 0.3 });
      voice(o, 'triangle', [[0, 262], [0.8, 524], [1.6, 333], [2.4, 604], [3, 222]], 3, 0.1);
    },
    cackle(o) {      // hee-hee-hee-hee!
      for (let i = 0; i < 7; i++) {
        const hz = 900 - i * 60;
        voice(o, 'square', [[0, hz], [0.12, hz * 0.8]], 0.14, 0.12, { delay: i * 0.17, lp: 2500 });
      }
    },
    dog(o) {         // woof woof!
      [0, 0.4].forEach(d => {
        voice(o, 'sawtooth', [[0, 380], [0.05, 520], [0.18, 180]], 0.2, 0.35, { delay: d, lp: 1400 });
        hiss(o, 0.15, 0.6, [[0, 1200]], { delay: d, type: 'bandpass', decay: true });
      });
    },
    bull(o) {        // snort snort... MOOO
      [0, 0.3].forEach(d => hiss(o, 0.22, 1, [[0, 1500], [0.2, 600]], { delay: d, type: 'bandpass', q: 2, decay: true }));
      voice(o, 'sawtooth', [[0, 130], [0.3, 150], [1.4, 105]], 1.5, 0.3, { delay: 0.7, lp: 600 });
    },
    magic(o) {       // sparkly twinkles
      const scale = [84, 86, 88, 91, 93, 96, 98, 100];
      for (let i = 0; i < 14; i++)
        voice(o, 'sine', [[0, note(scale[(i * 3) % scale.length] + (i > 7 ? 12 : 0))]], 0.35, 0.15, { delay: i * 0.1 });
      voice(o, 'triangle', [[0, note(72)]], 1.8, 0.08);
    },
    laser(o) {       // pew pew pew
      [0, 0.25, 0.5, 0.95, 1.2].forEach(d => voice(o, 'square', [[0, 1800], [0.18, 200]], 0.2, 0.12, { delay: d, lp: 3500 }));
    },
    digger(o) {      // diesel rumble + beep beep beep (backing up)
      voice(o, 'sawtooth', [[0, 45], [0.4, 70], [2.6, 50]], 2.6, 0.3, { lp: 350, trem: 18, tremDepth: 0.4 });
      for (let i = 0; i < 4; i++) voice(o, 'square', [[0, 1050]], 0.3, 0.09, { delay: 0.5 + i * 0.55, lp: 3000 });
    },
    tractor(o) {     // putt-putt-putt
      voice(o, 'square', [[0, 55], [2.4, 60]], 2.4, 0.3, { lp: 400, trem: 7, tremDepth: 0.95 });
      hiss(o, 2.4, 0.5, [[0, 300]], { trem: 7 });
    },
    engine(o) {      // VROOM VROOOOM + honk
      voice(o, 'sawtooth', [[0, 50], [0.35, 160], [0.6, 80], [1.1, 220], [1.8, 70]], 1.9, 0.3, { lp: 700, trem: 25, tremDepth: 0.35 });
      voice(o, 'square', [[0, 25], [0.35, 80], [0.6, 40], [1.1, 110], [1.8, 35]], 1.9, 0.15, { lp: 300 });
      [440, 554].forEach(hz => voice(o, 'square', [[0, hz]], 0.35, 0.08, { delay: 1.95, lp: 2000 }));
    }
  };

  const RULES = [
    [/ambulance/i, 'ambulance'], [/fire/i, 'fire'], [/police/i, 'police'],
    [/helicopter/i, 'helicopter'], [/airplane/i, 'airplane'], [/rocket/i, 'rocket'],
    [/tank|commando/i, 'tank'], [/school bus/i, 'bus'], [/ice cream/i, 'iceCream'],
    [/music/i, 'music'], [/submarine/i, 'submarine'], [/pirate/i, 'ship'],
    [/shark|megalodon/i, 'shark'], [/dino|triceratops|dragon|tiger|rhino/i, 'roar'],
    [/witch/i, 'cackle'], [/zombie|skeleton|grave|son-uva/i, 'spooky'],
    [/mutt/i, 'dog'], [/toro|raminator/i, 'bull'], [/unicorn|^ice$/i, 'magic'],
    [/space/i, 'laser'], [/tractor/i, 'tractor'],
    [/jcb|cement|garbage|tow|dump|bulldozer|logging|snow|harvester|crane/i, 'digger']
  ];
  const kindOf = name => (RULES.find(([re]) => re.test(name)) || [, 'engine'])[1];

  return function play(name) {
    const a = sfx.ctx();
    if (bus) {   // fade out whatever was playing
      const old = bus;
      old.gain.setTargetAtTime(0, a.currentTime, 0.05);
      setTimeout(() => old.disconnect(), 400);
    }
    bus = a.createGain(); bus.gain.value = 1; bus.connect(a.destination);
    SOUNDS[kindOf(name)](bus);
  };
})();

function honkTop() {
  const now = performance.now();
  if (now < crashingUntil) return;
  // the newest truck: the one in the air, or else the top of the tower
  const f = flying[flying.length - 1];
  const t = f || stack[stack.length - 1];
  if (!t) { sfx.honk(); return; }
  vehicleSound(t.truck.name);
  if (!f) {
    t.dance = now;
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, sp = 250 + Math.random() * 250;
      particles.push({ x: t.x + (Math.random() - .5) * t.w * .6, y: t.y + t.h, vx: Math.cos(a) * sp, vy: 500 + Math.random() * 300,
        c: ['#ff5e5b', '#3ec1d3', '#b388ff', '#ffd23f'][i % 4], r: 24, life: 1.2, note: true });
    }
  }
}

// ---------- keyboard focus ----------
// Keys only reach the game when its window is focused. If it isn't, show a big
// "Click to play" sign instead of silently ignoring Space.
const wake = document.getElementById('wake');
function checkFocus() { wake.classList.toggle('show', !document.hasFocus()); }
addEventListener('focus', checkFocus);
addEventListener('blur', checkFocus);
addEventListener('pointerdown', () => { window.focus(); setTimeout(checkFocus, 50); });
setInterval(checkFocus, 1000);
window.focus(); checkFocus();

// ---------- input: only Space, Enter and Shift ----------
addEventListener('keydown', e => {
  const isShift = e.key === 'Shift';
  if (e.code !== 'Space' && e.key !== 'Enter' && !isShift) return;
  e.preventDefault();
  if (e.repeat) return;   // holding the key down does nothing extra
  sfx.unlock();
  if (!started) {
    started = true;
    document.getElementById('start').classList.add('hidden');
    document.documentElement.requestFullscreen?.().catch(() => {});
  }
  if (e.code === 'Space') launch(); else if (isShift) honkTop(); else crash();
});

// ---------- drawing ----------
function drawSky(now) {
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, '#4fb3ff'); g.addColorStop(1, '#c9ecff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, groundY);
  // sun
  const sx = W * 0.86, sy = H * 0.14, sr = Math.min(W, H) * 0.07;
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(now / 4000);
  ctx.fillStyle = '#ffe066';
  for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.fillRect(sr * 1.15, -sr * 0.08, sr * 0.45, sr * 0.16); }
  ctx.restore();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
  ctx.fillStyle = '#5a3b00';
  ctx.beginPath(); ctx.arc(sx - sr * .33, sy - sr * .15, sr * .1, 0, 7); ctx.arc(sx + sr * .33, sy - sr * .15, sr * .1, 0, 7); ctx.fill();
  ctx.lineWidth = sr * .08; ctx.strokeStyle = '#5a3b00'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(sx, sy + sr * .05, sr * .45, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (const c of clouds) {
    c.x += c.v / 60; if (c.x > 1.2) c.x = -0.2;
    const x = c.x * W, y = c.y * H, r = 40 * c.s * Math.min(W, H) / 700;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 7); ctx.arc(x + r, y - r * .4, r * 1.1, 0, 7);
    ctx.arc(x + r * 2.1, y, r * .9, 0, 7); ctx.fill();
  }
}

function drawGround() {
  // hills
  ctx.fillStyle = '#7bd389';
  ctx.beginPath(); ctx.moveTo(0, groundY);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, groundY - 30 - Math.sin(x / 140) * 22);
  ctx.lineTo(W, groundY); ctx.fill();
  ctx.fillStyle = '#5cb85c'; ctx.fillRect(0, groundY - 6, W, 22);
  const g = ctx.createLinearGradient(0, groundY + 16, 0, H);
  g.addColorStop(0, '#a1683a'); g.addColorStop(1, '#6d4223');
  ctx.fillStyle = g; ctx.fillRect(0, groundY + 16, W, H - groundY);
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  for (let i = 0; i < 30; i++) {
    const x = (i * 197) % W, y = groundY + 30 + ((i * 53) % Math.max(1, H - groundY - 40));
    ctx.beginPath(); ctx.ellipse(x, y, 10, 5, 0, 0, 7); ctx.fill();
  }
}

function drawTruck(t, x, y, rot = 0, sx = 1, sy = 1, alpha = 1) {
  if (!t.truck.img.complete || !t.truck.img.naturalWidth) return;
  const [px, py] = toScreen(x, y);
  const w = t.w * scale, h = t.h * scale;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);           // bottom-center of the truck
  ctx.rotate(rot);
  ctx.scale((t.flip ? -1 : 1) * sx, sy);
  ctx.drawImage(t.truck.img, -w / 2, -h, w, h);
  ctx.restore();
}

function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.fill();
}

function drawBubble(now) {
  if (!bubble) return;
  const age = (now - bubble.t) / 1000;
  const pop = age < 0.35 ? 1 + Math.sin(age / 0.35 * Math.PI) * 0.35 : 1;
  const size = Math.min(W, H) * 0.16 * pop;
  const x = W * 0.13, y = H * 0.17;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1d3c78'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(x, y, size * 0.75, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff5e5b';
  ctx.font = `bold ${size}px "Arial Rounded MT Bold", "Chalkboard SE", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(bubble.n, x, y + size * 0.05);
  if (age < 3) {
    ctx.globalAlpha = Math.min(1, (3 - age) * 2);
    const fs = Math.min(W, H) * 0.065;
    ctx.font = `bold ${fs}px "Arial Rounded MT Bold", "Chalkboard SE", sans-serif`;
    ctx.lineWidth = fs * 0.18; ctx.strokeStyle = '#1d3c78'; ctx.lineJoin = 'round';
    ctx.strokeText(bubble.name, W / 2, H * 0.08);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(bubble.name, W / 2, H * 0.08);
    ctx.globalAlpha = 1;
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  groundY = H * 0.84;

  // camera zooms out as the tower grows
  const need = Math.max(stackTopOf(stack), reservedTop) + 420;
  const target = Math.min(baseScale(), (groundY - H * 0.04) / need);
  scale += (target - scale) * Math.min(1, dt * 3);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(now);
  drawGround();

  // shadow under the tower
  if (stack.length) {
    const [sx, sy] = toScreen(0, 0);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(sx, sy + 4, TRUCK_W * scale * 0.55, 14 * scale + 4, 0, 0, 7); ctx.fill();
  }

  // landed stack with a little wobble that settles
  const st = (now - swayT) / 1000;
  const wob = sway * Math.exp(-st * 2.2) * Math.sin(st * 9);
  stack.forEach((t, i) => {
    const k = stack.length > 1 ? i / (stack.length - 1) : 0;
    const a = (now - t.born) / 1000;
    const sq = a < 0.45 ? 1 - Math.sin(a / 0.45 * Math.PI) * 0.18 * Math.exp(-a * 3) : 1;
    const breathe = Math.sin(now / 700 + i) * 0.6;
    // happy hop + wiggle when Shift plays its sound
    const da = t.dance ? (now - t.dance) / 1000 : 9;
    const hop = da < 0.5 ? Math.sin(da / 0.5 * Math.PI) * 45 : 0;
    const wig = da < 1.5 ? Math.sin(da * 25) * 0.06 * (1 - da / 1.5) : 0;
    drawTruck(t, t.x + wob * k * (1 + i * 0.15) + breathe, t.y + hop, wob * k * 0.002 + wig,
              1 + (1 - sq) * 0.6, sq);
  });

  // trucks in the air
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i];
    let p = (now - f.t0) / f.dur;
    if (p >= 1) { flying.splice(i, 1); land(f); continue; }
    const drive = 0.3;   // first part: drive along the ground, then JUMP
    if (p < drive) {
      const q = p / drive;
      f.x = f.startX + (f.targetX - f.startX) * 0.35 * q;
      f.y = Math.abs(Math.sin(q * Math.PI * 4)) * 8;   // bumpy drive
      f.rot = Math.sin(q * 20) * 0.03;
    } else {
      const q = (p - drive) / (1 - drive);
      const e = q < .5 ? 2 * q * q : 1 - (-2 * q + 2) ** 2 / 2;
      const x0 = f.startX + (f.targetX - f.startX) * 0.35;
      f.x = x0 + (f.targetX - x0) * e;
      // rise from the ground to the top of the tower, with a big hop on the way
      f.y = f.targetY * Math.sin(q * Math.PI / 2) + 4 * 280 * q * (1 - q);
      f.rot = f.spin ? f.spin * q * Math.PI * 2 : (q - 0.5) * 0.25 * (f.flip ? 1 : -1);
    }
    drawTruck(f, f.x, f.y, f.rot);
  }

  // crash debris
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.vy -= 1800 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    if (d.y < 0) {
      d.y = 0;
      if (d.bounces < 2) { d.vy = -d.vy * 0.45; d.vx *= 0.7; d.vr *= 0.6; d.bounces++; }
      else { d.vy = 0; d.vx *= 0.9; d.vr *= 0.85; }
    }
    const age = (now - d.born) / 1000;
    const alpha = age > 1.6 ? Math.max(0, 1 - (age - 1.6) / 0.6) : 1;
    if (alpha <= 0) { debris.splice(i, 1); continue; }
    drawTruck(d, d.x, d.y, d.rot, 1, 1, alpha);
  }

  // stars & confetti
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy -= 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 0.9;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    const [px, py] = toScreen(p.x, p.y);
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    ctx.fillStyle = p.c;
    const r = p.r * Math.max(scale, 0.5);
    if (p.note) {
      ctx.font = `bold ${r * 3}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('♪', px, py);
    } else if (p.star) star(px, py, r); else { ctx.beginPath(); ctx.arc(px, py, r * 0.6, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  drawBubble(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
